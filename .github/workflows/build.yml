name: Release

on:
  # Manual trigger only — run from the Actions tab
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      NOTARY_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      # Secrets (set in the repo settings):
      #   APP_CERT_P12 / INSTALLER_CERT_P12  base64 of the exported .p12 files
      #   CERT_PASSWORD                      their password
      #   NOTARY_APPLE_ID, NOTARY_PASSWORD   Apple ID + app-specific password
      #   NOTARY_TEAM_ID                     T2SGYX37P4
      - name: Import signing certificates
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          for var in APP_CERT_P12 INSTALLER_CERT_P12; do
            echo "${!var}" | base64 --decode > "$RUNNER_TEMP/$var.p12"
            security import "$RUNNER_TEMP/$var.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$NOTARY_TEAM_ID"
        env:
          APP_CERT_P12: ${{ secrets.APP_CERT_P12 }}
          INSTALLER_CERT_P12: ${{ secrets.INSTALLER_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}

      - name: Generate version
        id: tag
        run: echo "version=$(date +'%Y.%m.%d-%H%M')" >> "$GITHUB_OUTPUT"

      - name: Build, sign and notarize
        run: |
          VERSION="${{ steps.tag.outputs.version }}" scripts/release.sh
          mv dist/NepaliInput-*.pkg dist/NepaliInput.pkg

      - name: Create Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: release-${{ steps.tag.outputs.version }}
          name: Release ${{ steps.tag.outputs.version }}
          body: |
            Nepali typing and voice dictation for macOS (universal: Apple Silicon and Intel).

            **Install:** download `NepaliInput.pkg`, double-click it, then add the keyboard in
            **System Settings → Keyboard → Input Sources → + → Nepali → Nepali Input**.

            **Homebrew:**

            ```sh
            brew tap parajulibkrm/macos-nepali-input-tool https://github.com/${{ github.repository }}
            brew install --cask parajulibkrm/macos-nepali-input-tool/nepali-input
            ```
          files: ./dist/NepaliInput.pkg
